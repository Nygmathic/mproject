baseURL = "/"
languageCode = "en-us"
title = "Veridus Post"

[pagination]
  pagerSize = 35

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Independent journalism, rooted in truth."
  author = "Veridus Editorial"
  author_bio = "Veridus Post brings context and integrity to the stories that matter — examining the ideas, events, and power dynamics that define our era."
  patreon_url = "https://patreon.com/veriduspost"
  buymesoda_url = "https://buymeacoffee.com/veriduspost"

