{{ define "main" }}
<div class="about-page">
  <div class="article-container">

    <header class="about-header">
      <h1 class="about-title">{{ .Title }}</h1>
      {{ with .Params.subtitle }}
        <p class="about-subtitle">{{ . }}</p>
      {{ end }}
    </header>

    <div class="about-body">
      {{ .Content }}
    </div>

  </div>
</div>
{{ end }}
