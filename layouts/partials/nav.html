{{/* Header Navigation */}}
<header class="site-header">
  <div class="container">
    <div class="site-title">
      <a href="/">{{ .Site.Title }}</a>
    </div>
    <p class="site-tagline">{{ .Site.Params.description }}</p>
    
    <nav role="navigation" aria-label="Main">
      <ul>
        <li><a href="/" {{ if eq .Section "" }}class="active"{{ end }}>Home</a></li>
        <li><a href="/categories/news/" {{ if eq .Section "news" }}class="active"{{ end }}>News</a></li>
        <li><a href="/categories/opinion/" {{ if eq .Section "opinion" }}class="active"{{ end }}>Opinion</a></li>
        <li><a href="/categories/lifestyle/" {{ if eq .Section "lifestyle" }}class="active"{{ end }}>Lifestyle</a></li>
        <li><a href="/about/">About</a></li>
      </ul>
    </nav>
  </div>
</header>
