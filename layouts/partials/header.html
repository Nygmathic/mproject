<header class="np-header">
  <div class="np-topbar">
    <div class="np-topbar-inner">
      <button class="np-hamburger" id="np-hamburger" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="np-topbar-date">{{ now.Format "Monday, January 2, 2006" }}</span>
      <span class="np-topbar-sep">|</span>
      <span class="np-topbar-edition">Global Edition</span>
      <div class="np-topbar-actions">
        <a href="/saved/" class="np-topbar-icon" aria-label="Saved articles" title="Saved articles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a href="/search/" class="np-topbar-icon" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="np-masthead">
    <a href="/" class="np-masthead-wordmark">{{ .Site.Title }}</a>
    <p class="np-masthead-tagline">{{ .Site.Params.description }}</p>
  </div>

  <nav class="np-navbar" aria-label="Sections">
    <div class="np-navbar-inner">
      <div class="np-navbar-links">
        {{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      </div>
      <a href="/donate/" class="np-navbar-subscribe">Support Veridus</a>
    </div>
  </nav>

  <div class="np-drawer" id="np-drawer" aria-hidden="true">
    <div class="np-drawer-head">
      <span class="np-drawer-title">{{ .Site.Title }}</span>
      <button class="np-drawer-close" id="np-drawer-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <nav class="np-drawer-nav">
      <a href="/">Front Page</a>
      {{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      <a href="/search/">Search</a>
      <a href="/saved/">Saved</a>
      <a href="/writers/">Writers</a>
      <a href="/about/">About</a>
      <a href="/donate/" class="np-drawer-donate">Support Veridus</a>
    </nav>
  </div>
  <div class="np-drawer-overlay" id="np-drawer-overlay"></div>
</header>

<script>
(function () {
  var hamburger = document.getElementById('np-hamburger');
  var drawer    = document.getElementById('np-drawer');
  var closeBtn  = document.getElementById('np-drawer-close');
  var overlay   = document.getElementById('np-drawer-overlay');

  function openDrawer() {
    drawer.classList.add('active');
    overlay.classList.add('active');
    drawer.setAttribute('aria-hidden', 'false');
    hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    drawer.classList.remove('active');
    overlay.classList.remove('active');
    drawer.setAttribute('aria-hidden', 'true');
    hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  if (hamburger) hamburger.addEventListener('click', openDrawer);
  if (closeBtn)  closeBtn.addEventListener('click', closeDrawer);
  if (overlay)   overlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var html = document.documentElement;
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('veridus-theme', next); } catch (e) {}
    });
  }
})();
</script>
