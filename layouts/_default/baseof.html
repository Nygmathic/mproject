<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="site-body">
  {{ partial "header.html" . }}

  <main class="site-main" id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <!-- Newsletter Signup Form Handler -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("newsletter-form");
      if (!form) return;

      const messageDiv = document.getElementById("newsletter-message");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const emailInput = form.querySelector('input[type="email"]');
        const email = emailInput.value.trim();

        messageDiv.style.display = "block";
        messageDiv.style.color = "#555";
        messageDiv.textContent = "Submitting...";

        try {
          const response = await fetch("https://newsletter-api.xmania365.workers.dev", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email: email }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            messageDiv.style.color = "green";
            messageDiv.textContent = data.message || "Thank you for subscribing!";
            form.reset();
          } else {
            messageDiv.style.color = "red";
            messageDiv.textContent = data.error || "Subscription failed. Please try again.";
          }
        } catch (err) {
          messageDiv.style.color = "red";
          messageDiv.textContent = "An error occurred. Please try again later.";
        }
      });
    });
  </script>
</body>
</html>
