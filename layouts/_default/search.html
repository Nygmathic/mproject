{{ define "main" }}
<div class="search-page">
  <div class="search-container">
    <div class="search-header">
      <h1>Search</h1>
      <p class="search-subtitle">Find articles across news, opinion, and lifestyle.</p>
    </div>

    <div class="search-card">
      <div class="search-form-wrap">
        <form id="search-form" role="search" autocomplete="off">
          <div class="search-field">
            <svg class="search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
            <input
              type="search"
              id="search-input"
              class="search-field-input"
              placeholder="Search articles…"
              aria-label="Search articles"
              autocomplete="off"
            >
            <button type="button" id="search-clear" class="search-field-clear" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <div id="search-status" class="search-status" aria-live="polite"></div>
      <div id="search-placeholder" class="search-placeholder">
        <p class="search-placeholder-hint">Start typing to search all articles.</p>
      </div>
      <div id="search-results" class="search-results" aria-live="polite" aria-label="Search results"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
(function() {
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');
  const statusEl = document.getElementById('search-status');
  const placeholder = document.getElementById('search-placeholder');
  const resultsEl = document.getElementById('search-results');
  let fuse = null;

  async function init() {
    try {
      const res = await fetch('/index.json');
      if (!res.ok) throw new Error('Index not found');
      const data = await res.json();
      fuse = new Fuse(data, {
        keys: ['title', 'summary', 'content', 'categories'],
        threshold: 0.3,
        ignoreLocation: true,
        minMatchCharLength: 2
      });
    } catch (err) {
      console.error('Search init failed:', err);
      statusEl.textContent = 'Search index not available. Please try again later.';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function highlight(text, query) {
    if (!text) return '';
    const safe = text.length > 240 ? text.slice(0, 240) + '…' : text;
    const words = query.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return escapeHtml(safe);
    const regex = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return escapeHtml(safe).replace(regex, '<mark>$1</mark>');
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  function render(query) {
    const q = query.trim();

    if (q.length < 2) {
      resultsEl.innerHTML = '';
      statusEl.innerHTML = '';
      placeholder.hidden = false;
      clearBtn.hidden = (q.length === 0);
      return;
    }

    placeholder.hidden = true;
    clearBtn.hidden = false;

    if (!fuse) {
      statusEl.textContent = 'Loading search…';
      return;
    }

    const results = fuse.search(q).slice(0, 20);

    statusEl.innerHTML = results.length
      ? `<strong>${results.length}</strong> result${results.length !== 1 ? 's' : ''} for "${escapeHtml(q)}"`
      : 'No results.';

    if (!results.length) {
      resultsEl.innerHTML = `
        <div class="search-no-results">
          <p>No articles found for "<strong>${escapeHtml(q)}</strong>".</p>
          <p>Try different keywords, or browse the <a href="/archive/">archive</a>.</p>
        </div>`;
      return;
    }

    resultsEl.innerHTML = results.map(({ item }) => {
      const cat = (item.categories && item.categories[0]) ? item.categories[0] : '';
      return `
        <article class="search-result">
          ${cat ? `<span class="search-result-cat">${escapeHtml(cat)}</span>` : ''}
          <h2 class="search-result-title">
            <a href="${escapeHtml(item.url)}">${highlight(item.title, q)}</a>
          </h2>
          <div class="search-result-meta">
            ${item.date ? `<time datetime="${escapeHtml(item.date)}">${formatDate(item.date)}</time>` : ''}
            ${item.readingTime ? `<span>· ${item.readingTime} min read</span>` : ''}
          </div>
          ${item.summary ? `<p class="search-result-summary">${highlight(item.summary, q)}</p>` : ''}
        </article>
      `;
    }).join('');
  }

  input.addEventListener('input', () => render(input.value));

  clearBtn.addEventListener('click', () => {
    input.value = '';
    render('');
    input.focus();
  });

  document.getElementById('search-form').addEventListener('submit', e => {
    e.preventDefault();
    const first = resultsEl.querySelector('.search-result-title a');
    if (first) first.focus();
  });

  window.addEventListener('DOMContentLoaded', () => {
    init().then(() => {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      if (q) {
        input.value = q;
        render(q);
      }
    });
  });
})();
</script>

<style>
/* Unified design – matches contact/donate pages (eyebrow removed) */
.search-page {
  background: var(--bg);
  padding: 3rem 1.5rem;
}
.search-container {
  max-width: 760px;
  margin: 0 auto;
}
.search-header {
  text-align: center;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.search-header h1 {
  font-family: var(--font-display);
  font-size: var(--step-3);
  font-weight: 800;
  margin: 0.5rem 0 0.25rem;
}
.search-subtitle {
  font-family: var(--font-headline-sans);
  font-weight: 400;
  font-size: var(--step-0);
  color: var(--text-secondary);
  line-height: 1.6;
}
.search-card {
  background: var(--bg-alt);
  border-radius: var(--radius-md);
  padding: 2rem 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid var(--border-light);
}
.search-form-wrap {
  margin-bottom: 1.5rem;
}
.search-field {
  display: flex;
  align-items: baseline;
  border-bottom: 2px solid var(--border);
  transition: border-color 0.2s;
}
.search-field:focus-within {
  border-bottom-color: var(--accent);
}
.search-field-icon {
  width: 22px;
  height: 22px;
  color: var(--text-muted);
  margin-right: 0.75rem;
  flex-shrink: 0;
}
.search-field-input {
  flex: 1;
  font-family: var(--font-ui);
  font-size: 1.2rem;
  background: transparent;
  border: none;
  padding: 0.6rem 0.5rem 0.6rem 0;
  outline: none;
  color: var(--text-primary);
}
.search-field-input::placeholder {
  color: var(--text-faint);
  font-style: italic;
}
.search-field-clear {
  background: none;
  border: none;
  padding: 0 0.3rem;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  align-items: center;
}
.search-field-clear svg {
  width: 18px;
  height: 18px;
}
.search-field-clear:hover {
  color: var(--text-primary);
}
.search-status {
  font-family: var(--font-ui);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 1rem;
  min-height: 1.2em;
}
.search-placeholder {
  text-align: center;
  padding: 2rem 0;
  border-top: 1px solid var(--border-light);
}
.search-placeholder-hint {
  font-family: var(--font-headline-sans);
  font-weight: 400;
  font-size: var(--step-0);
  font-style: italic;
  color: var(--text-muted);
}
.search-results {
  margin-top: 1rem;
}
.search-result {
  padding: 1.5rem 0;
  border-bottom: 1px solid var(--border-light);
}
.search-result:last-child {
  border-bottom: none;
}
.search-result-cat {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  display: block;
  margin-bottom: 0.3rem;
}
.search-result-title {
  font-family: 'Libre Franklin', var(--font-headline-sans), sans-serif;
  font-weight: 700;
  font-size: 1.3rem;
  margin: 0.25rem 0 0.3rem;
}
.search-result-title a {
  color: var(--text-primary);
  text-decoration: none;
  transition: color 0.18s;
}
.search-result-title a:hover {
  color: var(--accent);
}
.search-result-meta {
  display: flex;
  gap: 0.75rem;
  font-family: var(--font-ui);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}
.search-result-summary {
  font-family: var(--font-headline-sans);
  font-weight: 400;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--text-secondary);
}
.search-result-title mark,
.search-result-summary mark {
  background: rgba(var(--accent-rgb), 0.13);
  border-radius: 2px;
  padding: 0 2px;
  color: var(--text-primary);
}
[data-theme="dark"] .search-result-title mark,
[data-theme="dark"] .search-result-summary mark {
  background: rgba(var(--accent-rgb), 0.28);
}
.search-no-results {
  text-align: center;
  padding: 2rem 0;
  font-family: var(--font-headline-sans);
  font-weight: 400;
  font-size: var(--step-0);
  color: var(--text-secondary);
}
.search-no-results a {
  color: var(--accent);
  text-decoration: underline;
}
@media (max-width: 600px) {
  .search-card {
    padding: 1.5rem;
  }
  .search-result-title {
    font-size: 1.2rem;
  }
}
</style>
{{ end }}
