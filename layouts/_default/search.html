{{ define "main" }}
<div class="search-page">
  <div class="search-container">
    <div class="search-header">
      <h1>Search</h1>
      <p class="search-subtitle">Find articles across politics, business, climate, sports, technology, Africa, science, culture, opinion, and lifestyle.</p>
    </div>

    <div class="search-card">
      <div class="search-form-wrap">
        <form id="search-form" role="search" autocomplete="off">
          <div class="search-field">
            <svg class="search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.35-4.35"/>
            </svg>
            <input
              type="text"
              inputmode="search"
              id="search-input"
              class="search-field-input"
              placeholder="Search articles or writers…"
              aria-label="Search articles or writers"
              autocomplete="off"
              spellcheck="false"
            >
            <button type="button" id="search-clear" class="search-field-clear" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <div id="search-status" class="search-status" aria-live="polite"></div>
      <div id="search-placeholder" class="search-placeholder">
        <p class="search-placeholder-hint">Start typing to search by headline, topic, or writer.</p>
      </div>
      <div id="search-results" class="search-results" aria-live="polite" aria-label="Search results"></div>
    </div>
  </div>
</div>

<script>
(function() {
  var input = document.getElementById('search-input');
  var clearBtn = document.getElementById('search-clear');
  var statusEl = document.getElementById('search-status');
  var placeholder = document.getElementById('search-placeholder');
  var resultsEl = document.getElementById('search-results');
  var form = document.getElementById('search-form');
  if (!input || !clearBtn || !statusEl || !placeholder || !resultsEl || !form) return;

  var records = window.__vpSearchIndex || null;
  var loadError = false;

  async function init() {
    if (records) return;
    try {
      var res = await fetch('/index.json');
      if (!res.ok) throw new Error('Index not found');
      records = await res.json();
      window.__vpSearchIndex = records;
    } catch (err) {
      loadError = true;
      statusEl.textContent = 'Search index not available. Please try again later.';
    }
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function highlight(text, query) {
    if (!text) return '';
    var safe = text.length > 240 ? text.slice(0, 240) + '…' : text;
    var words = query.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return escapeHtml(safe);
    var pattern = words.map(function(w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
    var regex = new RegExp('(' + pattern + ')', 'gi');
    return escapeHtml(safe).replace(regex, '<mark>$1</mark>');
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr + 'T00:00:00Z');
    return d.toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
    });
  }

  function scoreRecord(item, tokens) {
    var title = (item.title || '').toLowerCase();
    var author = (item.author || '').toLowerCase();
    var summary = (item.summary || '').toLowerCase();
    var content = (item.content || '').toLowerCase();
    var section = (item.section || '').toLowerCase();
    var score = 0;

    for (var i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      var hit = 0;
      if (title.indexOf(tok) !== -1) hit += 8;
      if (author.indexOf(tok) !== -1) hit += 7;
      if (section.indexOf(tok) !== -1) hit += 5;
      if (summary.indexOf(tok) !== -1) hit += 3;
      if (content.indexOf(tok) !== -1) hit += 1;
      if (hit === 0) return 0;
      score += hit;
    }
    return score;
  }

  function syncUrl(q) {
    try {
      var u = new URL(window.location.href);
      if (q.length >= 2) u.searchParams.set('q', q);
      else u.searchParams.delete('q');
      history.replaceState(history.state, '', u.pathname + u.search + u.hash);
    } catch (e) {}
  }

  function render(query) {
    var q = query.trim();

    if (q.length < 2) {
      resultsEl.innerHTML = '';
      statusEl.innerHTML = '';
      placeholder.hidden = false;
      clearBtn.hidden = (q.length === 0);
      return;
    }

    placeholder.hidden = true;
    clearBtn.hidden = false;

    if (!records) {
      if (!loadError) statusEl.textContent = 'Loading search…';
      return;
    }

    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
    var scored = [];
    for (var i = 0; i < records.length; i++) {
      var s = scoreRecord(records[i], tokens);
      if (s > 0) scored.push({ item: records[i], score: s });
    }
    scored.sort(function(a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return (b.item.date || '').localeCompare(a.item.date || '');
    });

    var results = scored.slice(0, 20);

    statusEl.innerHTML = results.length
      ? '<strong>' + results.length + '</strong> result' + (results.length !== 1 ? 's' : '') + ' for "' + escapeHtml(q) + '"'
      : 'No results.';

    if (!results.length) {
      resultsEl.innerHTML =
        '<div class="search-no-results">' +
          '<p>No articles found for "<strong>' + escapeHtml(q) + '</strong>".</p>' +
          '<p>Try different keywords, or browse the <a href="/sitemap/">sitemap</a>.</p>' +
        '</div>';
      return;
    }

    resultsEl.innerHTML = results.map(function(entry) {
      var item = entry.item;
      var sec = item.section || '';
      return (
        '<article class="search-result">' +
          (sec ? '<span class="search-result-cat">' + escapeHtml(sec) + '</span>' : '') +
          '<h2 class="search-result-title"><a href="' + escapeHtml(item.url) + '">' + highlight(item.title, q) + '</a></h2>' +
          '<div class="search-result-meta">' +
            (item.author ? '<span>By ' + highlight(item.author, q) + '</span>' : '') +
            (item.author && item.date ? ' <span>·</span> ' : '') +
            (item.date ? '<time datetime="' + escapeHtml(item.date) + '">' + formatDate(item.date) + '</time>' : '') +
            (item.readingTime ? ' <span>· ' + item.readingTime + ' min read</span>' : '') +
          '</div>' +
          (item.summary ? '<p class="search-result-summary">' + highlight(item.summary, q) + '</p>' : '') +
        '</article>'
      );
    }).join('');
  }

  input.addEventListener('input', function() {
    syncUrl(input.value.trim());
    render(input.value);
  });

  clearBtn.addEventListener('click', function() {
    input.value = '';
    syncUrl('');
    render('');
    input.focus();
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    render(input.value);
    var first = resultsEl.querySelector('.search-result-title a');
    if (first) first.focus();
  });

  function start() {
    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q && !input.value) {
      input.value = q;
    }
    if (input.value) render(input.value);

    init().then(function() {
      if (input.value.trim().length >= 2) {
        render(input.value);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
{{ end }}
