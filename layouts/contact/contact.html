{{ define "main" }}
<div class="page-container">
  <div class="page-header">
    <h1>Contact</h1>
    <p class="page-subtitle">We read every message. Expect a reply within 2–3 business days.</p>
  </div>
  <div class="contact-card">
    <form class="contact-form" action="https://formsubmit.co/ocotrona@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from Veridus contact form">
      <input type="hidden" name="_next" value="https://veridus.space/thanks/">
      <input type="hidden" name="_captcha" value="false">
      <input type="text" name="_honey" style="display:none">

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g., Adebayo Ogunlesi">
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required placeholder="hello@example.com">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="What would you like to say?"></textarea>
      </div>

      <button type="submit" class="submit-btn">
        <span>Send message</span>
        <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

    <div class="contact-alternate">
      <p>Or write directly:</p>
      <a href="mailto:contact@veridus.space">contact@veridus.space</a>
    </div>
  </div>
</div>

<style>
.page-header,
.page-header .page-subtitle {
  text-align: center;
}
.contact-form {
  max-width: 480px;
  margin: 0 auto;
  text-align: center;
}
.form-group label {
  text-align: center;
  display: block;
}
.form-group input,
.form-group textarea {
  text-align: center;
}
.submit-btn {
  justify-content: center;
  margin: 0 auto;
}
.contact-alternate {
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}
</style>
{{ end }}
