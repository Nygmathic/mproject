{{ define "main" }}
<div class="contact-page">
  <div class="contact-container">
    <div class="contact-header">
      <h1>Contact</h1>
      <p class="contact-subtitle">Get in touch with the Veridus team.</p>
    </div>
    <div class="contact-card">
      <form class="contact-form" action="https://formsubmit.co/contact@veridus.space" method="POST">
        <!-- FormSubmit.co required fields -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_subject" value="Veridus Contact Form Submission">
        <input type="hidden" name="_next" value="{{ .Site.BaseURL }}thanks/">
        
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send message</button>
      </form>
      <div class="contact-alternate">
        <p>Or email us directly:</p>
        <a href="mailto:contact@veridus.space">contact@veridus.space</a>
      </div>
    </div>
  </div>
</div>

<style>
.contact-page {
  background: var(--bg, #FFFFFF);
  padding: 3rem 1.5rem;
  min-height: 60vh;
}
.contact-container {
  max-width: 760px;
  margin: 0 auto;
}
.contact-header {
  text-align: center;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border, #E5E5E5);
}
.contact-header h1 {
  font-family: 'Inter Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: var(--step-3, 2rem);
  font-weight: 800;
  margin: 0.5rem 0 0.25rem;
  color: var(--text-primary, #1A1A1A);
}
.contact-subtitle {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-weight: 400;
  font-size: var(--step-0, 1.125rem);
  color: var(--text-secondary, #3D3D3D);
  line-height: 1.6;
}
.contact-card {
  background: var(--bg-alt, #FBFBFB);
  border-radius: var(--radius-md, 10px);
  padding: 2rem 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid var(--border-light, #EFEFEF);
}
.contact-form .form-group {
  margin-bottom: 1.5rem;
}
.contact-form label {
  font-family: 'Roboto Mono', 'Courier New', monospace;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.5rem;
  color: var(--text-primary, #1A1A1A);
}
.contact-form input,
.contact-form textarea {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1.05rem;
  padding: 0.75rem 1rem;
  line-height: 1.5;
  width: 100%;
  box-sizing: border-box;
  border: 1px solid var(--border, #E5E5E5);
  border-radius: var(--radius-sm, 6px);
  background: var(--bg, #FFFFFF);
  color: var(--text-primary, #1A1A1A);
  transition: border-color 0.2s;
}
.contact-form input:focus,
.contact-form textarea:focus {
  outline: none;
  border-color: var(--accent, #D94838);
}
.submit-btn {
  font-family: 'Roboto Mono', 'Courier New', monospace;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.85rem 1.8rem;
  background: var(--accent, #D94838);
  color: #fff;
  border: none;
  border-radius: var(--radius-pill, 50px);
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  width: auto;
}
.submit-btn:hover {
  background: var(--hover-dark, #1a5490);
  transform: translateY(-1px);
}
.contact-alternate {
  margin-top: 2rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--border-light, #EFEFEF);
  text-align: center;
}
.contact-alternate p {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-weight: 400;
  font-size: 0.85rem;
  color: var(--text-muted, #6E6E6E);
  margin-bottom: 0.5rem;
}
.contact-alternate a {
  font-family: 'Roboto Mono', 'Courier New', monospace;
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent, #D94838);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent, #D94838);
}
.contact-alternate a:hover {
  border-bottom-style: solid;
}
</style>

<script>
// Form handling for FormSubmit.co
(function() {
  const form = document.querySelector('.contact-form');
  if (!form) return;

  form.addEventListener('submit', function(e) {
    const btn = form.querySelector('.submit-btn');
    btn.textContent = 'Sending...';
    btn.disabled = true;
    
    // Re-enable after 5 seconds in case of slow submission
    setTimeout(function() {
      btn.textContent = 'Send message';
      btn.disabled = false;
    }, 5000);
  });
})();
</script>
{{ end }}
