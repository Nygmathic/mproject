name: Auto News Poster

on:
  schedule:
    # ── General run: every 2 hours for all niches ────────────────────
    - cron: "0 */2 * * *"

    # ── Sports-only: timed after Premier League matches end ──────────
    # Saturday slots: after 12:30 kick (14:30), 15:00 kick (17:00), 17:30 kick (19:30)
    - cron: "30 14 * * 6"
    - cron: "0 17 * * 6"
    - cron: "30 19 * * 6"
    # Sunday slots: after 14:00 kick (16:00), 16:30 kick (18:30)
    - cron: "0 16 * * 0"
    - cron: "30 18 * * 0"
    # Midweek & Friday evenings: after 19:45/20:00 kick (22:00)
    - cron: "0 22 * * 1,2,3,5"

  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Check API keys
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY_1" ] && echo "✅ Gemini key 1 set" || echo "⚠️  Gemini key 1 NOT set"
          [ -n "$GEMINI_API_KEY_2" ] && echo "✅ Gemini key 2 set" || echo "⚠️  Gemini key 2 NOT set"
          [ -n "$GEMINI_API_KEY_3" ] && echo "✅ Gemini key 3 set" || echo "⚠️  Gemini key 3 NOT set"
          [ -n "$GEMINI_API_KEY_4" ] && echo "✅ Gemini key 4 set" || echo "ℹ️  Gemini key 4 not set (optional)"
          [ -n "$GEMINI_API_KEY_5" ] && echo "✅ Gemini key 5 set" || echo "ℹ️  Gemini key 5 not set (optional)"
          [ -n "$GEMINI_API_KEY_6" ] && echo "✅ Gemini key 6 set" || echo "ℹ️  Gemini key 6 not set (optional)"
          [ -n "$GROQ_API_KEY" ]     && echo "✅ Groq key set"     || echo "⚠️  Groq key NOT set"
          [ -z "$GEMINI_API_KEY_1" ] && [ -z "$GEMINI_API_KEY_2" ] && [ -z "$GEMINI_API_KEY_3" ] && [ -z "$GROQ_API_KEY" ] && echo "❌ No AI keys — aborting" && exit 1 || true

      - name: Fetch and post news
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Sports-only crons are identified by their specific minute patterns
          SCHEDULE="${GITHUB_EVENT_SCHEDULE}"
          if [[ "$SCHEDULE" == "30 14 * * 6" ]] || \
             [[ "$SCHEDULE" == "0 17 * * 6"  ]] || \
             [[ "$SCHEDULE" == "30 19 * * 6" ]] || \
             [[ "$SCHEDULE" == "0 16 * * 0"  ]] || \
             [[ "$SCHEDULE" == "30 18 * * 0" ]] || \
             [[ "$SCHEDULE" == "0 22 * * 1,2,3,5" ]]; then
            echo "⚽ Post-match run — sports only"
            python auto_news_poster.py --sports-only
          else
            echo "🌍 General run — all niches"
            python auto_news_poster.py
          fi

      - name: Commit and push new articles
        run: |
          git config --global user.name "Veridus Auto Poster"
          git config --global user.email "autopost@veridus.space"
          git add content/ .posted_articles.json
          # Also stage any downloaded images (jpg/png/webp in page bundles)
          git add "*.jpg" "*.png" "*.webp" 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto: Add news articles $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Trigger Hugo deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/hugo.yml/dispatches \
            -d '{"ref":"main"}'