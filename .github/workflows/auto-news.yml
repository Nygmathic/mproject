name: Auto News Poster

on:
  schedule:
    # 3 runs/day. The script posts at most 1 per niche per day, so later runs
    # only fill niches that failed earlier and otherwise exit without committing.
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write   # push generated posts
  actions: write    # trigger the Hugo deploy workflow

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests trafilatura

      - name: Check API keys
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: |
          for i in 1 2 3 4 5 6; do
            var="GEMINI_API_KEY_$i"
            [ -n "${!var}" ] && echo "✅ Gemini key $i set" || echo "ℹ️  Gemini key $i not set"
          done

      - name: Run Auto News Poster
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          # Optional: set a repo variable GEMINI_MODELS (e.g. "gemini-3.6-flash,gemini-2.5-flash")
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python -u auto_news_poster.py

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "Veridus Auto Poster"
          git config user.email "autopost@veridus.space"
          git add content/ .posted_articles.json
          # Deploy only if an actual post was added, not just log changes
          if [ -n "$(git status --porcelain content/)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto: Add news articles $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing to commit."
          fi

      # Pushes made with GITHUB_TOKEN do not trigger other workflows,
      # so explicitly kick off the Hugo deploy.
      - name: Trigger site deploy
        if: steps.commit.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yml --ref main