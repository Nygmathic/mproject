name: Auto News Poster

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Check API Keys
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          [ -n "$GEMINI_API_KEY_1" ] && echo "✅ Gemini key 1 set" || echo "⚠️  Gemini key 1 NOT set"
          [ -n "$GEMINI_API_KEY_2" ] && echo "✅ Gemini key 2 set" || echo "⚠️  Gemini key 2 NOT set"
          [ -n "$GEMINI_API_KEY_3" ] && echo "✅ Gemini key 3 set" || echo "⚠️  Gemini key 3 NOT set"
          [ -n "$GROQ_API_KEY" ] && echo "✅ Groq key set" || echo "ℹ️  Groq key NOT set (optional)"

      - name: Run Auto News Poster
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          SCHEDULE="${GITHUB_EVENT_SCHEDULE}"
          if [[ "$SCHEDULE" == "30 14 * * 6" ]] || \
             [[ "$SCHEDULE" == "0 17 * * 6"  ]] || \
             [[ "$SCHEDULE" == "30 19 * * 6" ]] || \
             [[ "$SCHEDULE" == "0 16 * * 0"  ]] || \
             [[ "$SCHEDULE" == "30 18 * * 0" ]] || \
             [[ "$SCHEDULE" == "0 22 * * 1,2,3,5" ]]; then
            echo "⚽ Post-match run — sports only"
            python -u auto_news_poster.py --sports-only
          else
            echo "🌍 General run — all niches"
            python -u auto_news_poster.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "Veridus Auto Poster"
          git config --global user.email "autopost@veridus.space"
          git add content/ .posted_articles.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto: Add news articles $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          else
            echo "No new articles to commit."
          fi