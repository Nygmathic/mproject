baseURL: "https://veridus.space/"
languageCode: "en-us"
title: "Veridus"

outputs:
  home:
    - HTML
    - JSON
    - RSS
  section:
    - HTML
    - RSS
  page:
    - HTML

# Hugo auto-generates /sitemap.xml — this configures it
sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.5

params:
  description: "Refined news and global insights."
  brand_name: "Veridus"
  subscribe_url: "/subscribe/"
  
  # Social Media Links - Icons will appear for any configured links
  social:
    twitter: "https://twitter.com/yourusername"
    facebook: "https://facebook.com/profile.php?id=61587502772266"
    linkedin: "https://linkedin.com/in/yourprofile"
    instagram: "https://instagram.com/yourusername"
    youtube: "https://youtube.com/@yourchannel"
    # tiktok: "https://tiktok.com/@yourusername"
    email: "contact@veridus.space"
    rss: "/index.xml"

menu:
  main:
    - name: "News"
      url: "/news/"
      weight: 1
    - name: "Opinion"
      url: "/opinion/"
      weight: 2
    - name: "Lifestyle"
      url: "/lifestyle/"
      weight: 3
    - name: "Search"
      url: "/search/"
      weight: 6
    - name: "Videos"
      url: "/videos/"
      weight: 4
    - name: "Podcasts"
      url: "/podcasts/"
      weight: 5


      