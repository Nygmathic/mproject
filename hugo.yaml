baseURL: "https://veridus.space/"
languageCode: "en-us"
title: "Veridus"

outputs:
  home:
    - HTML
    - JSON
    - RSS
  section:
    - HTML
    - RSS
  page:
    - HTML

sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.5

params:
  description: "context behind the viral."
  brand_name: "Veridus"

  # Author — site-level fallback used in single.html author bio card
  author: "Veridus Editorial"
  author_title: "Editorial Team"
  author_bio: "Veridus is an independent publication exploring the meaning behind viral events."
  author_twitter: ""        # e.g. https://twitter.com/yourhandle
  author_linkedin: ""       # e.g. https://linkedin.com/in/yourprofile
  author_email: "contact@veridus.space"

  # Substack
  substack_url: "https://veridusnetwork.substack.com"

  # Google Analytics — set your Measurement ID here, used in head.html
  analytics_id: "G-RTN42NN743"

  # Social Media Links — comment out any that are not yet active
  social:
    # twitter: "https://twitter.com/yourusername"     # uncomment when active
   #facebook: "https://facebook.com/profile.php?id=61587502772266"
    # linkedin: "https://linkedin.com/in/yourprofile" # uncomment when active
    # instagram: "https://instagram.com/yourusername" # uncomment when active
    # youtube: "https://youtube.com/@yourchannel"     # uncomment when active
    email: "contact@veridus.space"
    rss: "/index.xml"

menu:
  main:
    - name: "Africa"
      url: "/categories/africa/"
      weight: 1
    - name: "Business"
      url: "/categories/business/"
      weight: 2
    - name: "Climate"
      url: "/categories/climate/"
      weight: 3
    - name: "Law"
      url: "/categories/law/"
      weight: 4
    - name: "Opinion"
      url: "/categories/opinion/"
      weight: 5
    - name: "Politics"
      url: "/categories/politics/"
      weight: 6
    - name: "Sports"
      url: "/categories/sports/"
      weight: 7

# Dart Sass — replaces deprecated libsass
markup:
  goldmark:
    renderer:
      unsafe: true
  sass:
    transpiler: dartsass